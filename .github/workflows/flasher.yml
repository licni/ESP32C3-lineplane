# 版本流水號: r2 (2026-10-21) main 分支打包完直接發布 Release(標籤 flasher-v<APP_VERSION>,設為最新),不用另外推標籤
# 舊: r1 (2026-10-21) 初版:在 Windows 打包燒錄工具 LineplaneFlasher.exe
# - 改到 tools/flasher/ 就打包,exe 放在這次執行的 Artifacts(Actions 頁面下載).
# - main 分支(推送或手動執行)打包完建立/更新 Release「燒錄工具 v版本」並附上 exe,設為最新版:
#   固定下載網址 https://github.com/licni/ESP32C3-lineplane/releases/latest/download/LineplaneFlasher.exe
#   同一版本重跑會覆蓋 exe;發新版前先改 lineplane_flasher.py 的 APP_VERSION.
name: 燒錄工具 exe

on:
  push:
    paths:
      - "tools/flasher/**"
      - ".github/workflows/flasher.yml"
    tags:
      - "flasher-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: python -m pip install -r tools/flasher/requirements.txt

      - name: 單元測試
        working-directory: tools/flasher
        run: python -m unittest -v test_fw_image

      - name: 打包 exe
        working-directory: tools/flasher
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name LineplaneFlasher --collect-data esptool lineplane_flasher.py

      - name: 檢查 exe 帶了 esptool 的 ESP32-C3 燒錄小程式
        working-directory: tools/flasher
        shell: pwsh
        run: |
          $exe = "dist/LineplaneFlasher.exe"
          if (-not (Test-Path $exe)) { throw "沒有產生 $exe" }
          $hit = python -m PyInstaller.utils.cliutils.archive_viewer --list $exe | Select-String "esp32c3.json"
          if (-not $hit) { throw "exe 裡沒有 esptool 的 esp32c3.json(--collect-data esptool 沒作用)" }
          $hit
          "大小 {0:N0} 位元組" -f (Get-Item $exe).Length

      - uses: actions/upload-artifact@v4
        with:
          name: LineplaneFlasher
          path: tools/flasher/dist/LineplaneFlasher.exe
          if-no-files-found: error

      - name: 讀工具版本
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path tools/flasher/lineplane_flasher.py -Pattern '^APP_VERSION = "([^"]+)"'
          if (-not $m) { throw "lineplane_flasher.py 找不到 APP_VERSION" }
          "ver=$($m.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: 發布 Release(main 分支)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/flasher-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flasher-v${{ steps.ver.outputs.ver }}
          target_commitish: ${{ github.sha }}
          name: 線控飛機韌體燒錄工具 v${{ steps.ver.outputs.ver }}
          make_latest: "true"
          files: tools/flasher/dist/LineplaneFlasher.exe
          body: |
            ## 線控飛機韌體燒錄工具(Windows,免安裝)

            **下載:[LineplaneFlasher.exe](https://github.com/licni/ESP32C3-lineplane/releases/latest/download/LineplaneFlasher.exe)**

            1. 下載後直接打開,不用安裝. Windows 跳出「Windows 已保護您的電腦」時,按「其他資訊」→「仍要執行」.
            2. 用可以傳資料的 USB 線接上 ESP32-C3 開發板,工具會自動找到板子.
            3. 選「普通版」或「帶螢幕板」,在「韌體版本」挑一版(預設最新版),按「下載這個版本」.
            4. 按「開始燒錄」,確定. 燒完會自動檢查,全部打勾就完成了.
            5. 手機連板子的 WiFi 熱點,瀏覽器開 http://192.168.4.1 設定.

            燒錄與測試時請拆下螺旋槳. 找不到板子時:按住板子上的 BOOT 鍵,拔掉再插上 USB,放開 BOOT.
            詳細說明:https://github.com/licni/ESP32C3-lineplane/blob/main/tools/flasher/README.md
