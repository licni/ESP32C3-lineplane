; ============================================================================
; 線控飛機油門控制器 ESP32-C3 SuperMini
; 版本流水號: r3 (2026-09-14) 預設只編 esp32c3_supermini(沒加 -e 時不會連 ota 環境一起跑)
; 舊: r2 (2026-09-14) 韌體檔不帶本機路徑(使用者名稱):extra_scripts pio_strip_paths.py
; 舊: r1 (2026-09-13) 初版:pioarduino 3.3.11,OTA 分割表,原生 USB 序列埠
; ============================================================================
; SuperMini 沒有專屬板型定義,用 esp32-c3-devkitm-1:同樣是 ESP32-C3 + 4MB flash.
; ============================================================================

[platformio]
default_envs = esp32c3_supermini

[env:esp32c3_supermini]
; 官方 espressif32 平台停在 Arduino 核心 2.0.17. 改用社群 fork pioarduino 55.03.311
; (Arduino 核心 3.3.11),與參考專案 OpenActiveSuspension 同版,已驗證可用.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = esp32-c3-devkitm-1
framework = arduino

; 分割表:要做 OTA 就必須有兩個應用程式插槽(新韌體先寫進另一個,驗證完才切換).
; min_spiffs = 兩個各 1.9MB 的插槽 + 小 SPIFFS. 參考專案用的 huge_app 只有一個插槽,不能 OTA.
board_build.partitions = min_spiffs.csv

; SuperMini 只有原生 USB(USB Serial/JTAG),這兩個旗標讓 Serial 走原生 USB.
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

; Arduino 核心會把原始檔完整路徑編進韌體(路徑裡有電腦使用者名稱),發布前換成短前綴.
extra_scripts = pre:tools/pio_strip_paths.py

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

; 無線燒錄(ArduinoOTA). 用法:pio run -e ota -t upload [--upload-port <IP>]
; 預設走家用 WiFi 的 lineplane.local;板子退回熱點模式時加 --upload-port 192.168.4.1.
; 密碼與 wifi_manager.h 的 OTA_PASSWORD 相同.
[env:ota]
extends = env:esp32c3_supermini
upload_protocol = espota
upload_port = lineplane.local
upload_flags =
	--auth=12345678
